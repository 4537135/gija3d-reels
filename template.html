<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<!-- Direction: print-bed brutalism — graphite bed grid, huge Unbounded type, acid-lime layer-line accents. -->
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200;800&family=Manrope:wght@400;700&display=block&subset=latin-ext" rel="stylesheet">
<style>
:root { --bg:#141414; --ink:#F2EFE8; --accent:#C6FF00; --muted:#8A8780; }
* { margin:0; box-sizing:border-box; }
body { width:1080px; height:1920px; overflow:hidden; background:var(--bg); color:var(--ink); font-family:Manrope, sans-serif; }
#bed { position:absolute; inset:0; background-image:linear-gradient(#ffffff0d 2px,transparent 2px),linear-gradient(90deg,#ffffff0d 2px,transparent 2px); background-size:90px 90px; }
#img { position:absolute; left:0; right:0; top:0; height:1150px; background-size:cover; background-position:center; opacity:0; }
#img::after { content:""; position:absolute; inset:0; background:linear-gradient(transparent 55%, var(--bg)); }
#brand { position:absolute; top:90px; left:80px; font:800 34px Unbounded; letter-spacing:.04em; }
#brand b { color:var(--accent); }
#block { position:absolute; left:80px; right:80px; top:520px; display:flex; flex-direction:column; gap:36px; }
#count { font:200 220px/0.9 Unbounded; color:var(--accent); }
#count:empty { display:none; }
#title { font:800 118px/1.02 Unbounded; text-transform:uppercase; }
#title .w { display:inline-block; }
#sub { font:200 52px/1.25 Unbounded, Manrope, 'Segoe UI', 'Cambria Math', sans-serif; color:var(--muted); } /* fallbacks carry φ θ ₁ ₂ for formulas */
#art { position:absolute; left:80px; top:800px; width:920px; height:620px; }
#art svg { width:100%; height:100%; overflow:visible; }
body.hasart #block { top:230px; gap:22px; }
body.hasart #count { font-size:110px; }
body.hasart #title { font-size:96px; }
body.hasart #sub { font-size:44px; }
#cap { position:absolute; left:70px; right:70px; bottom:260px; font:700 54px/1.25 Manrope; text-align:center; }
#cap span { opacity:.28; } #cap span.on { opacity:1; } #cap span.now { color:var(--accent); }
#layers { position:absolute; left:80px; bottom:150px; height:10px; background:var(--accent); }
/* Math format: nothing but the canvas, on pure black. */
body.math { background:#000; }
body.math #bed, body.math #img, body.math #brand, body.math #block, body.math #cap, body.math #layers { display:none; }
body.math #art { left:0; top:0; width:1080px; height:1920px; }
</style></head><body>
<div id="bed"></div><div id="img"></div>
<div id="brand">GIJA<b>3D</b></div>
<div id="block"><div id="count"></div><div id="title"></div><div id="sub"></div></div><div id="art"></div><div id="cap"></div><div id="layers"></div>
<script>
let S = [], starts = [], total = 0, cur = -1, LIB = '', THREE_LIB = '';
const $ = id => document.getElementById(id);
const ease = x => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3);
window.artErrors = []; // [{ scene, error }] from code scenes, read by render.js / artcheck.js
let MATH = null, CW = 920, CH = 620, CS = 2; // math format: one full-screen 1080x1920 canvas on black
window.load = ({ scenes, brand, lib, math, three }) => {
  THREE_LIB = three || '';
  MATH = math || null; if (MATH) { CW = 1080; CH = 1920; CS = 1; }
  document.body.classList.toggle('math', !!MATH);
  for (const [k, v] of Object.entries(brand)) document.documentElement.style.setProperty('--' + k, v);
  S = scenes; LIB = lib || ''; let t = 0; starts = S.map(s => (t += s.dur) - s.dur); total = t; cur = -1;
  S.forEach(s => { if (s.image) new Image().src = s.image; });
};

// ---- Code scenes: model-written canvas code runs in a sandboxed iframe (no network, no file access, no parent DOM). ----
let frame = null, frameReady = null, seq = 0;
const pending = {};
addEventListener('message', e => {
  if (!frame || e.source !== frame.contentWindow) return;
  if (e.data.ready) frame._ready();
  else if (pending[e.data.id]) { pending[e.data.id](e.data.err || null); delete pending[e.data.id]; }
});
function codeFrame(code, engine) {
  const is3d = engine === 'three';
  const f = document.createElement('iframe');
  f.setAttribute('sandbox', 'allow-scripts');
  f.style.cssText = `width:${CW}px;height:${CH}px;border:0;display:block;background:transparent`;
  const setup = JSON.stringify({ w: CW, h: CH, colors: (MATH && MATH.colors) || {} });
  const safe = JSON.stringify(code).replace(/</g, '\\u003c'); // so a script-closing tag inside scene code can't end the tag
  f.srcdoc = `<!doctype html><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200;800&family=Manrope:wght@400;800&display=block" rel="stylesheet">
<style>html,body{margin:0;background:transparent;overflow:hidden}canvas{width:${CW}px;height:${CH}px;display:block;position:absolute;left:0;top:0}</style>
${is3d ? '<canvas id="g"></canvas>' : ''}<canvas id="c" width="${CW * CS}" height="${CH * CS}"></canvas>
<script>${LIB}<\/script>
${is3d ? `<script>${THREE_LIB}<\/script>` : ''}
<script>
P.setup(${setup});
let draw, err = null;
const ctx = document.getElementById('c').getContext('2d');
if (${is3d}) {
  // 3D: the code is the body of setup(THREE, P, C, W, H); it returns { scene, camera, update(t, d, ctx) }.
  // WebGL draws underneath; ctx is a 2D overlay on top for labels and formulas (all P helpers work on it).
  try {
    if (typeof THREE === 'undefined') throw new Error('three.js did not load');
    const W = ${CW}, H = ${CH};
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('g'), antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(${CS === 1 ? 1 : 1.5}); renderer.setSize(W, H, false); renderer.setClearColor(0x000000, 0);
    const made = new Function('THREE', 'P', 'C', 'W', 'H', ${safe})(THREE, P, P.C, W, H);
    if (!made || !made.scene || !made.camera) throw new Error('3D code must return { scene, camera, update }');
    draw = (c, t, d) => { if (made.update) made.update(t, d, c); renderer.render(made.scene, made.camera); };
  } catch (e) { err = '3D setup failed: ' + ((e && e.message) || e); }
} else {
  try { draw = new Function('ctx', 't', 'd', 'P', 'C', ${safe}); } catch (e) { err = 'syntax error: ' + e.message; }
}
onmessage = e => {
  const { t, d, id } = e.data; let er = err;
  if (!er) {
    let s = 1; Math.random = () => ((s = (s * 16807) % 2147483647) - 1) / 2147483646; // deterministic per frame
    try { ctx.setTransform(${CS}, 0, 0, ${CS}, 0, 0); ctx.clearRect(0, 0, ${CW}, ${CH}); ctx.globalAlpha = 1; ctx.setLineDash([]); ctx.save(); draw(ctx, t, d, P, P.C); ctx.restore(); }
    catch (x) { er = String((x && x.message) || x); }
  }
  parent.postMessage({ id, err: er }, '*');
};
Promise.all([document.fonts.load('200 28px Unbounded'), document.fonts.load('800 28px Unbounded'), document.fonts.load('800 28px Manrope')]).catch(() => {}).then(() => parent.postMessage({ ready: true }, '*'));
<\/script>`;
  frameReady = new Promise(res => { f._ready = res; setTimeout(res, 8000); });
  return f;
}
const raf = () => new Promise(r => requestAnimationFrame(r));

function build(i) {
  const s = S[i];
  $('title').innerHTML = (s.title || '').split(/\s+/).map(w => `<span class="w">${w}</span>`).join(' ');
  $('sub').textContent = s.sub || '';
  $('cap').innerHTML = s.say.split(/\s+/).map(w => `<span>${w}</span>`).join(' ');
  // Long captions shrink so they never climb into the illustration above them.
  let capSize = 54; $('cap').style.fontSize = '';
  while ($('cap').offsetHeight > 215 && capSize > 36) $('cap').style.fontSize = (capSize -= 2) + 'px';
  $('img').style.backgroundImage = s.image ? `url("${s.image}")` : 'none';
  $('block').style.top = s.image ? '980px' : '';
  // Per-scene art: either an SVG with CSS animations (--d = scene seconds), or canvas code (math scenes).
  // Shadow DOM keeps the SVG's own <style> (class names, keyframes) from leaking into the page layout.
  const root = $('art').shadowRoot || $('art').attachShadow({ mode: 'open' });
  frame = null; frameReady = null;
  if (s.code) { root.innerHTML = ''; frame = codeFrame(s.code, s.engine); root.appendChild(frame); }
  else root.innerHTML = s.art ? '<style>:host{display:block} svg{width:100%;height:100%;overflow:visible}</style>' + s.art : '';
  $('art').style.setProperty('--d', s.dur + 's');
  document.body.classList.toggle('hasart', !!(s.art || s.code));
  $('count').textContent = s.kind === 'tip' ? String(S.slice(0, i + 1).filter(x => x.kind === 'tip').length).padStart(2, '0') : '';
}
// Deterministic: everything is a pure function of t, so every render is identical.
window.seek = async t => {
  let i = starts.findIndex((st, k) => t < st + S[k].dur); if (i < 0) i = S.length - 1;
  if (i !== cur) { build(i); cur = i; }
  const lt = t - starts[i], d = S[i].dur;
  document.querySelectorAll('#title .w').forEach((w, k) => {
    const p = ease((lt - k * 0.08) / 0.35);
    w.style.opacity = p; w.style.transform = `translateY(${(1 - p) * 60}px)`;
  });
  const ps = ease((lt - 0.3) / 0.4); $('sub').style.opacity = ps;
  $('img').style.opacity = S[i].image ? ease(lt / 0.4) : 0;
  $('img').style.transform = `scale(${1.08 - 0.08 * lt / d})`;
  // Captions: word timing approximated by character share of the scene's voice duration.
  const ws = [...document.querySelectorAll('#cap span')], chars = ws.reduce((a, w) => a + w.textContent.length + 1, 0);
  let acc = 0; const spoken = (lt / Math.max(d - 0.25, 0.1)) * chars;
  ws.forEach(w => { const a = acc; acc += w.textContent.length + 1; w.className = spoken >= acc ? 'on' : spoken >= a ? 'on now' : ''; });
  // Drive the art's CSS animations by hand so each frame is exact.
  ($('art').shadowRoot || $('art')).getAnimations().forEach(an => { an.pause(); an.currentTime = lt * 1000; });
  $('layers').style.width = (920 * t / total) + 'px'; // progress bar = "layers printed"
  if (frame) { // ask the sandbox to draw this exact moment and wait until it has
    await frameReady;
    const f = frame, err = await new Promise(res => {
      const id = ++seq; pending[id] = res;
      f.contentWindow.postMessage({ t: lt, d, id }, '*');
      setTimeout(() => { if (pending[id]) { delete pending[id]; res('timed out (infinite loop or very slow code?)'); } }, 5000);
    });
    if (err && !window.artErrors.some(e => e.scene === i)) window.artErrors.push({ scene: i, error: err });
    await raf(); await raf();
  }
};
</script></body></html>
