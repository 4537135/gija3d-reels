<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<!-- Direction: print-bed brutalism — graphite bed grid, huge Unbounded type, acid-lime layer-line accents. -->
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200;800&family=Manrope:wght@400;700&display=block&subset=latin-ext" rel="stylesheet">
<style>
:root { --bg:#141414; --ink:#F2EFE8; --accent:#C6FF00; --muted:#8A8780; }
* { margin:0; box-sizing:border-box; }
body { width:1080px; height:1920px; overflow:hidden; background:var(--bg); color:var(--ink); font-family:Manrope, sans-serif; }
#bed { position:absolute; inset:0; background-image:linear-gradient(#ffffff0d 2px,transparent 2px),linear-gradient(90deg,#ffffff0d 2px,transparent 2px); background-size:90px 90px; }
#img { position:absolute; left:0; right:0; top:0; height:1150px; background-size:cover; background-position:center; opacity:0; }
#img::after { content:""; position:absolute; inset:0; background:linear-gradient(transparent 55%, var(--bg)); }
#brand { position:absolute; top:90px; left:80px; font:800 34px Unbounded; letter-spacing:.04em; }
#brand b { color:var(--accent); }
#block { position:absolute; left:80px; right:80px; top:520px; display:flex; flex-direction:column; gap:36px; }
#count { font:200 220px/0.9 Unbounded; color:var(--accent); }
#count:empty { display:none; }
#title { font:800 118px/1.02 Unbounded; text-transform:uppercase; }
#title .w { display:inline-block; }
#sub { font:200 52px/1.25 Unbounded; color:var(--muted); }
#cap { position:absolute; left:70px; right:70px; bottom:260px; font:700 58px/1.25 Manrope; text-align:center; }
#cap span { opacity:.28; } #cap span.on { opacity:1; } #cap span.now { color:var(--accent); }
#layers { position:absolute; left:80px; bottom:150px; height:10px; background:var(--accent); }
</style></head><body>
<div id="bed"></div><div id="img"></div>
<div id="brand">GIJA<b>3D</b></div>
<div id="block"><div id="count"></div><div id="title"></div><div id="sub"></div></div><div id="cap"></div><div id="layers"></div>
<script>
let S = [], starts = [], total = 0, cur = -1;
const $ = id => document.getElementById(id);
const ease = x => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3);
window.load = ({ scenes, brand }) => {
  for (const [k, v] of Object.entries(brand)) document.documentElement.style.setProperty('--' + k, v);
  S = scenes; let t = 0; starts = S.map(s => (t += s.dur) - s.dur); total = t;
  S.forEach(s => { if (s.image) new Image().src = s.image; });
};
function build(i) {
  const s = S[i];
  $('title').innerHTML = (s.title || '').split(/\s+/).map(w => `<span class="w">${w}</span>`).join(' ');
  $('sub').textContent = s.sub || '';
  $('cap').innerHTML = s.say.split(/\s+/).map(w => `<span>${w}</span>`).join(' ');
  $('img').style.backgroundImage = s.image ? `url("${s.image}")` : 'none';
  $('block').style.top = s.image ? '980px' : '520px';
  $('count').textContent = s.kind === 'tip' ? String(S.slice(0, i + 1).filter(x => x.kind === 'tip').length).padStart(2, '0') : '';
}
// Deterministic: everything is a pure function of t, so every render is identical.
window.seek = t => {
  let i = starts.findIndex((st, k) => t < st + S[k].dur); if (i < 0) i = S.length - 1;
  if (i !== cur) { build(i); cur = i; }
  const lt = t - starts[i], d = S[i].dur;
  document.querySelectorAll('#title .w').forEach((w, k) => {
    const p = ease((lt - k * 0.08) / 0.35);
    w.style.opacity = p; w.style.transform = `translateY(${(1 - p) * 60}px)`;
  });
  const ps = ease((lt - 0.3) / 0.4); $('sub').style.opacity = ps;
  $('img').style.opacity = S[i].image ? ease(lt / 0.4) : 0;
  $('img').style.transform = `scale(${1.08 - 0.08 * lt / d})`;
  // Captions: word timing approximated by character share of the scene's voice duration.
  const ws = [...document.querySelectorAll('#cap span')], chars = ws.reduce((a, w) => a + w.textContent.length + 1, 0);
  let acc = 0; const spoken = (lt / Math.max(d - 0.25, 0.1)) * chars;
  ws.forEach(w => { const a = acc; acc += w.textContent.length + 1; w.className = spoken >= acc ? 'on' : spoken >= a ? 'on now' : ''; });
  $('layers').style.width = (920 * t / total) + 'px'; // progress bar = "layers printed"
};
</script></body></html>
