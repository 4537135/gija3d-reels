<svg viewBox="0 0 920 620" xmlns="http://www.w3.org/2000/svg" font-family="Unbounded"><style>.r{stroke:#2a2a28;stroke-width:9;stroke-linecap:round} .lbl{font-weight:200;font-size:30px;fill:var(--muted);letter-spacing:.08em} .big{font-weight:800;fill:var(--accent)}.r{animation:gone .25s linear both}
.noz{animation:sweep calc(var(--d) - 1.4s) .4s linear both}
.gloss{animation:shine .6s calc(var(--d) - .9s) both}
.glow{animation:pulse .5s infinite alternate}
